[project]
name = "almost-real-backend"
version = "0.1.0"
description = "Almost Real AI - Autonomous Video Generation & Social Publishing Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.0",
    "edge-tts>=6.1.0",
    "imageio-ffmpeg>=0.5.0",
    "moviepy>=1.0.3",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
]

[project.scripts]
start = "main:main"
